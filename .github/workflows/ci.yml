name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eia
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: eia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eia -d eia_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy backend tests evaluation
      - name: Unit tests
        run: uv run pytest tests/unit -q
      - name: Migrations match the models
        env:
          EIA_DATABASE_URL: postgresql+asyncpg://eia:ci-only-password@localhost:5432/eia_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Integration tests
        env:
          EIA_DATABASE_URL: postgresql+asyncpg://eia:ci-only-password@localhost:5432/eia_test
          EIA_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/integration -q -rs

  model-tests:
    # Downloads the real embedding model from Hugging Face and checks it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Embedding model tests
        env:
          EIA_RUN_MODEL_TESTS: "1"
        run: uv run pytest tests/model -q -rs

  retrieval-benchmark:
    # Measures retrieval quality with the real models. The report is shown in the
    # job summary and kept as an artifact; nothing in it is hand-written.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eia
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: eia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eia -d eia_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      EIA_DATABASE_URL: postgresql+asyncpg://eia:ci-only-password@localhost:5432/eia_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - name: Run the benchmark
        run: |
          uv run python -m evaluation.benchmarks.retrieval --out benchmark-report
          cat benchmark-report/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: benchmark-report/

  compose-smoke:
    # Builds the image and runs the real stack the way a user would, then
    # registers, logs in and reads /me through it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          password=$(openssl rand -hex 16)
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$password/" .env
          sed -i "s#^EIA_DATABASE_URL=.*#EIA_DATABASE_URL=postgresql+asyncpg://eia:$password@postgres:5432/eia#" .env
          sed -i "s/^EIA_JWT_SECRET=.*/EIA_JWT_SECRET=$(openssl rand -hex 32)/" .env
          # No API key in CI: the keyless stand-in model exercises the task pipeline.
          sed -i "s/^EIA_LLM_PROVIDER=.*/EIA_LLM_PROVIDER=fake/" .env
      - name: Start the stack
        run: |
          docker compose up -d --build
          for _ in $(seq 1 90); do
            curl -fsS localhost:8000/readyz && exit 0
            sleep 2
          done
          echo "API never became ready" >&2
          exit 1
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/readyz
          curl -fsS -X POST localhost:8000/api/v1/auth/register -H 'content-type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke test password","organization_name":"Smoke"}'
          token=$(curl -fsS -X POST localhost:8000/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke test password"}' | jq -r .access_token)
          curl -fsS localhost:8000/api/v1/me -H "authorization: Bearer $token" | jq -e '.role == "owner"'

          # Upload a document and wait for the worker (real embedding model) to index it.
          auth="authorization: Bearer $token"
          collection=$(curl -fsS -X POST localhost:8000/api/v1/collections -H "$auth" \
            -H 'content-type: application/json' -d '{"name":"Smoke"}' | jq -r .id)
          printf '# Smoke test\n\nThe worker should parse, chunk and embed this file.\n' > smoke.md
          document=$(curl -fsS -X POST "localhost:8000/api/v1/collections/$collection/documents" \
            -H "$auth" -F "file=@smoke.md" | jq -r .id)
          wait_for() {  # url, success status, failure status
            for _ in $(seq 1 120); do
              body=$(curl -fsS "$1" -H "$auth")
              case "$(echo "$body" | jq -r .status)" in
                "$2") echo "$body"; return 0 ;;
                "$3") echo "$body"; return 1 ;;
              esac
              sleep 3
            done
            echo "timed out waiting for $1" >&2
            return 1
          }
          wait_for "localhost:8000/api/v1/documents/$document" ready failed

          # Run a research task through the worker and check it found the document.
          task=$(curl -fsS -X POST localhost:8000/api/v1/tasks -H "$auth" \
            -H 'content-type: application/json' \
            -d "{\"question\":\"What should the worker do with this file?\",\"collection_ids\":[\"$collection\"]}" \
            | jq -r .id)
          result=$(wait_for "localhost:8000/api/v1/tasks/$task" completed failed)
          echo "$result" | jq -e '.result.retrieve.sources[0].filename == "smoke.md"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
